<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Compras - Feriapp</title>
    <link rel="stylesheet" href="../css/principal.css">
</head>
<body>
    <div class="contenedorinterno">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="titulointerno">mis compras</h1>
            <a href="principal.html" class="botonaccion">volver al catálogo</a>
        </div>

        <div class="layoutpanel">
            <aside class="barralateral">
                <a href="perfil.html">editar perfil</a>
                <a href="pedidos.html" class="activo">mis compras</a>
                <a href="devoluciones.html">devoluciones</a>
            </aside>

            <section class="contenidopanel">
                <h2>historial reciente</h2>
                <p style="color: #666; margin-bottom: 25px;">seguimiento de tus adquisiciones.</p>
                <div id="listapedidos"></div>
            </section>
        </div>
    </div>

    <script src="../js/principal.js"></script>
    <script>
        const historial = FeriApp.getOrders();
        const contenedor = document.getElementById('listapedidos');

        if (historial.length === 0) {
            contenedor.innerHTML = "<p style='color: #666;'>aún no hay compras registradas.</p>";
        } else {
            historial.forEach(p => {
                const est = p.estado || 'en camino';
                let claseEst = est === 'en camino' ? 'pendiente' : (est === 'en devolución' ? 'devolucion' : '');
                let btnHTML = est === 'en devolución' 
                    ? `<button class="botonaccion" style="background:#ccc; width:100%; cursor:not-allowed;" disabled>en proceso</button>`
                    : `<button class="botonaccion botondevolver" data-orden="${p.id}" style="background:#d90429; width:100%;">solicitar devolución</button>`;

                contenedor.innerHTML += `
                <div class="tarjetapedido">
                    <div>
                        <h3 style="color:#2d5a27;">Orden #${p.id}</h3>
                        <p style="font-size:0.85rem; color:#666;">📅 ${p.fecha}</p>
                        <p style="color:#666; margin-top:5px;">${p.items} producto(s)</p>
                    </div>
                    <div style="text-align:right;">
                        <p style="font-weight:bold; margin-bottom:5px;">$${p.total.toLocaleString('es-CO')}</p>
                        <span class="estadopedido ${claseEst}">${est}</span>
                    </div>
                    ${btnHTML}
                </div>`;
            });
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('botondevolver')) {
                localStorage.setItem('ordendevolucion', e.target.getAttribute('data-orden'));
                window.location.href = 'devoluciones.html';
            }
        });
    </script>
</body>
</html>
