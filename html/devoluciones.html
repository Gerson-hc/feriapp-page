<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devoluciones - Feriapp</title>
    <link rel="stylesheet" href="../css/principal.css">
</head>
<body>
    <div class="contenedorinterno">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="titulointerno">gestión de devoluciones</h1>
            <a href="catalogo.html" class="botonaccion">volver al catálogo</a>
        </div>

        <div class="layoutpanel">
            <aside class="barralateral">
                <a href="perfil.html">editar perfil</a>
                <a href="pedidos.html">mis compras</a>
                <a href="devoluciones.html" class="activo">devoluciones</a>
            </aside>

            <section class="contenidopanel">
                <h2>radicar solicitud</h2>
                <div class="forminterno">
                    <label for="idorden">número de venta</label>
                    <input type="text" id="idorden" inputmode="numeric" placeholder="ej. 5">
                    <label for="motivodevolucion">motivo</label>
                    <select id="motivodevolucion">
                        <option>producto en mal estado</option>
                        <option>no coincide con lo pedido</option>
                        <option>faltaron productos</option>
                    </select>
                    <label for="detallesdevolucion">detalles</label>
                    <textarea id="detallesdevolucion" style="height:80px;"></textarea>
                    <button id="enviardevolucion" class="botonaccion" style="margin-top:15px;">enviar</button>
                </div>

                <hr style="margin: 40px 0; border-top: 2px dashed #ccc;">
                <h2>historial de devoluciones</h2>
                <div id="listadevoluciones" style="margin-top:20px;"></div>
            </section>
        </div>
    </div>

    <script src="../js/principal.js"></script>
    <script src="../js/datos.js"></script>
    <script>
        const sesion = FeriSesion.actual();
        const yo = sesion ? (sesion.id || sesion.nombre) : null;
        const esc = FeriApp.escapeHTML;

        // Devoluciones del cliente en sesión (clave feriapp_devoluciones).
        function misDevoluciones() {
            return FeriStore.leer('feriapp_devoluciones', []).filter(d => String(d.cliente) === String(yo));
        }

        // Dibuja el historial de devoluciones radicadas.
        function renderizar() {
            const devols = misDevoluciones().sort((a, b) => b.id - a.id);
            const cont = document.getElementById('listadevoluciones');
            cont.innerHTML = devols.length === 0 ? "<p style='color:#666;'>sin devoluciones radicadas.</p>" : devols.map(d => `
                <div class="tarjetapedido" style="border-left-color:#d90429;">
                    <div>
                        <h3 style="color:#d90429;">Venta #${d.venta}</h3>
                        <p style="font-size:0.85rem; color:#666;">radicado: ${new Date(d.fecha).toLocaleString('es-CO')}</p>
                        <p style="margin-top:5px;"><strong>motivo:</strong> ${esc(d.motivo)} - ${esc(d.detalle)}</p>
                    </div>
                    <span class="estadopedido devolucion">${esc(d.estado)}</span>
                </div>`).join('');
        }

        // Precarga el número de venta que llega desde "mis compras".
        const ord = localStorage.getItem('ordendevolucion');
        if (ord) { document.getElementById('idorden').value = ord; localStorage.removeItem('ordendevolucion'); }
        renderizar();

        // Radica la devolución: la venta debe existir, ser del cliente, no estar cancelada ni tener otra devolución.
        document.getElementById('enviardevolucion').addEventListener('click', () => {
            const idVenta = parseInt(document.getElementById('idorden').value.trim().replace('#', ''), 10);
            const motivo = document.getElementById('motivodevolucion').value;
            const det = document.getElementById('detallesdevolucion').value.trim();
            if (!idVenta || !det) { alert('llena todos los campos.'); return; }

            const venta = FeriStore.leer('feriapp_ventas', []).find(v => v.id === idVenta && String(v.cliente) === String(yo));
            const todas = FeriStore.leer('feriapp_devoluciones', []);
            if (!venta) alert('La venta no existe o no es tuya.');
            else if (venta.estado === 'cancelada') alert('La venta está cancelada.');
            else if (todas.some(d => d.venta === idVenta)) alert('Esa venta ya tiene una devolución radicada.');
            else {
                todas.push({ id: todas.length + 1, venta: idVenta, cliente: yo, motivo, detalle: det, fecha: new Date().toISOString(), estado: 'radicada' });
                FeriStore.guardar('feriapp_devoluciones', todas);
                alert('radicado exitosamente.');
                document.getElementById('idorden').value = '';
                document.getElementById('detallesdevolucion').value = '';
                renderizar();
            }
        });
    </script>
</body>
</html>
