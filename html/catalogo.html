<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Feriapp</title>
    <link rel="stylesheet" href="../css/principal.css">
    <style>
        .filtros { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-3); }
        .filtros input, .filtros select { padding: 10px 14px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); min-width: 0; }
        .filtros input { flex: 2 1 220px; }
        .filtros select { flex: 1 1 170px; }
        .cat-layout { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-start; }
        .cat-grilla { flex: 3 1 460px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-2); min-width: 0; }
        .prod { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: var(--space-2); display: flex; flex-direction: column; gap: 6px; }
        .prod .ico { font-size: 2.2rem; }
        .prod h3 { color: var(--color-primary); font-size: 1.05rem; }
        .prod .meta { color: var(--color-text-muted); font-size: .82rem; }
        .prod .precio { font-weight: bold; font-size: 1.1rem; }
        .prod .cant { display: flex; gap: 8px; margin-top: auto; align-items: center; }
        .prod .cant > .botonaccion { flex: 1; }
        .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden; background: var(--color-surface); }
        .stepper button { width: 34px; border: 0; background: var(--color-surface-hover); font-size: 1.2rem; cursor: pointer; color: var(--color-primary); }
        .stepper button:disabled { opacity: .4; cursor: not-allowed; }
        .stepper input { width: 52px; text-align: center; border: 0; padding: 8px 2px; font: inherit; -moz-appearance: textfield; }
        .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .stepper.peq button { width: 28px; font-size: 1rem; } .stepper.peq input { width: 42px; padding: 4px 0; }
        .prod .cant button:disabled { opacity: .45; cursor: not-allowed; }
        .estrellas { color: var(--color-rating); }
        .bajo { color: var(--color-danger); font-size: .78rem; font-weight: bold; }
        .pedido { flex: 1 1 290px; background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: var(--space-3); position: sticky; top: 120px; }
        .pedido ul { list-style: none; padding: 0; margin: var(--space-1) 0; }
        .pedido li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--color-border); font-size: .9rem; }
        .pedido .quitar { background: none; border: 0; color: var(--color-danger); cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .total { display: flex; justify-content: space-between; font-size: 1.15rem; margin: var(--space-1) 0 var(--space-2); }
        .msg { padding: 10px 12px; border-radius: var(--radius-sm); font-size: .88rem; margin-bottom: var(--space-1); background: var(--color-danger-soft); color: var(--color-danger); }
        .msg.ok { background: #E6F2EA; color: var(--color-primary); }
        .vacio { color: var(--color-text-muted); }
        .enlace-sec { background: none; border: 0; color: var(--color-text-muted); text-decoration: underline; cursor: pointer; margin-top: var(--space-1); }
    </style>
</head>
<body>
    <header class="encabezado">
        <a href="principal.html" class="enlacelogo">
            <img src="../Imagenes/logo_sin_fondo.png" alt="Feriapp" style="height: 70px; width: auto; display: block;">
        </a>
        <nav class="navegacion">
            <a href="catalogo.html" class="enlacenav">catálogo</a>
            <a href="mapa.html" class="enlacenav">mapa</a>
            <a href="contacto.html" class="enlacenav">contacto</a>
            <a href="login.html" id="enlacesesion" class="enlacenav">iniciar sesión</a>
        </nav>
    </header>

    <div class="contenedorinterno">
        <h1 class="titulointerno">catálogo de productos</h1>
        <p class="vacio" style="margin-bottom: var(--space-2);">Busca productos de las plazas de mercado y sepáralos para recogerlos en el local. Puedes consultar sin iniciar sesión.</p>

        <div class="filtros">
            <input type="search" id="fbusca" placeholder="¿Qué buscas? ej: tomate, queso…" aria-label="Buscar producto">
            <select id="fcat" aria-label="Categoría"></select>
            <select id="fplaza" aria-label="Plaza"></select>
            <select id="flocal" aria-label="Local"></select>
        </div>

        <div class="cat-layout">
            <section class="cat-grilla" id="grilla" aria-live="polite"></section>
            <aside class="pedido" id="pedido" aria-live="polite"></aside>
        </div>
    </div>

    <script src="../js/datos.js"></script>
    <script>
    const $ = id => document.getElementById(id);
    const cop = n => '$' + Math.round(n).toLocaleString('es-CO');
    const prom = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
    const porId = id => productos.find(p => p.id === id);
    const localDe = id => locales.find(l => l.id === id);
    const plazaDe = id => plazas.find(p => p.id === id);
    const redondear = n => Math.round(n * 100) / 100;

    let pedido = FeriStore.leer('feriapp_pedido_borrador', null) || { local: null, items: [] }; // items: {id, cant}
    let aviso = null, confirmada = null;
    const guardarBorrador = () => FeriStore.guardar('feriapp_pedido_borrador', pedido);

    // ---- Filtros (CU-03): solo productos activos de locales con productor ----
    function llenarFiltros() {
        $('fcat').innerHTML = '<option value="">todas las categorías</option>' + Object.entries(categorias).map(([i, n]) => `<option value="${i}">${n}</option>`).join('');
        $('fplaza').innerHTML = '<option value="">todas las plazas</option>' + plazas.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
        llenarLocales();
    }
    function llenarLocales() {
        const pz = +$('fplaza').value;
        const ls = locales.filter(l => l.productor && (!pz || l.plaza === pz));
        $('flocal').innerHTML = '<option value="">todos los locales</option>' + ls.map(l => `<option value="${l.id}">${l.codigo} · ${l.nombre}</option>`).join('');
    }
    function filtrados() {
        const q = $('fbusca').value.trim().toLowerCase(), c = +$('fcat').value, pz = +$('fplaza').value, lo = +$('flocal').value;
        return productos.filter(p => {
            const l = localDe(p.local);
            return p.activo && l.productor && (!c || p.cat === c) && (!pz || l.plaza === pz) && (!lo || l.id === lo)
                && (!q || p.nombre.toLowerCase().includes(q));
        });
    }

    function pintarGrilla() {
        const lista = filtrados();
        if (!lista.length) { $('grilla').innerHTML = '<p class="vacio">No hay productos que coincidan con la búsqueda.</p>'; return; }
        $('grilla').innerHTML = lista.map(p => {
            const l = localDe(p.local), pz = plazaDe(l.plaza), pp = prom(p.calif), est = Inventario.estado(p);
            const bloqueado = est === 'agotado' || l.estado === 'cerrado', paso = Inventario.paso(p.u);
            const stockTxt = est === 'agotado' ? '<span class="bajo">agotado</span>'
                : `quedan ${fmtCant(p.cant)} ${p.u}${est === 'bajo' ? ' <span class="bajo">· pocas existencias</span>' : ''}`;
            return `<article class="prod">
                <span class="ico" aria-hidden="true">${iconosCategoria[p.cat]}</span>
                <h3>${p.nombre}</h3>
                <p class="meta">${l.nombre} · local ${l.codigo}<br>${pz.nombre}${l.estado === 'cerrado' ? ' · <strong>local cerrado</strong>' : ''}</p>
                <p><span class="precio">${cop(p.precio)}</span> <span class="meta">por ${p.u}</span></p>
                <p class="meta">${pp ? `<span class="estrellas">★</span> ${pp.toFixed(1)} · ` : 'sin calificaciones · '}${stockTxt}</p>
                <div class="cant">
                    <div class="stepper" role="group" aria-label="Cantidad de ${p.nombre} en ${p.u}">
                        <button type="button" data-q="${p.id},-1" aria-label="Menos" ${bloqueado ? 'disabled' : ''}>−</button>
                        <input type="number" id="q${p.id}" value="${Math.min(1, p.cant)}" min="${paso}" max="${p.cant}" step="${paso}" inputmode="decimal" aria-label="Cantidad (${p.u})" ${bloqueado ? 'disabled' : ''}>
                        <button type="button" data-q="${p.id},1" aria-label="Más" ${bloqueado ? 'disabled' : ''}>+</button>
                    </div>
                    <button class="botonaccion" data-add="${p.id}" ${bloqueado ? 'disabled' : ''}>${est === 'agotado' ? 'agotado' : 'agregar'}</button>
                </div>
            </article>`;
        }).join('');
    }

    // El cliente elige la cantidad con − / + o escribiéndola; se limita a múltiplos válidos y a las existencias
    function ajustarInput(id, delta) {
        const p = porId(id), inp = $('q' + id), paso = Inventario.paso(p.u);
        const v = redondear((parseFloat(inp.value) || 0) + delta * paso);
        inp.value = Math.max(paso, Math.min(p.cant, v));
    }

    // ---- Pedido (CU-05): productos de un mismo local ----
    function agregar(id) {
        aviso = null; confirmada = null;
        const p = porId(id), cant = parseFloat($('q' + id).value);
        if (pedido.items.length && pedido.local !== p.local) {
            aviso = `Tu pedido es del local ${localDe(pedido.local).codigo}. Sepáralo o vacíalo antes de agregar productos de otro local.`;
            return pintarPedido();
        }
        const ya = pedido.items.find(i => i.id === id), r = Inventario.validar(p, cant, ya ? ya.cant : 0);
        if (!r.ok) { aviso = r.msg; return pintarPedido(); } // flujo alterno 2a
        pedido.local = p.local;
        if (ya) ya.cant = redondear(ya.cant + cant); else pedido.items.push({ id, cant });
        guardarBorrador(); pintarPedido();
    }
    function cambiar(id, delta) { // − / + dentro del pedido
        const p = porId(id), i = pedido.items.find(x => x.id === id), nueva = redondear(i.cant + delta * Inventario.paso(p.u));
        aviso = null;
        if (nueva <= 0) return quitar(id);
        const r = Inventario.validar(p, nueva);
        if (!r.ok) { aviso = r.msg; return pintarPedido(); }
        i.cant = nueva; guardarBorrador(); pintarPedido();
    }
    function quitar(id) {
        pedido.items = pedido.items.filter(i => i.id !== id);
        if (!pedido.items.length) pedido.local = null;
        aviso = null; guardarBorrador(); pintarPedido();
    }
    function vaciar() { // flujo alterno 4a: el cliente cancela, no se registra nada
        pedido = { local: null, items: [] }; aviso = null; guardarBorrador(); pintarPedido();
    }
    const totalPedido = () => pedido.items.reduce((s, i) => s + porId(i.id).precio * i.cant, 0);

    function confirmar() {
        aviso = null;
        const s = FeriSesion.actual();
        if (!s) { aviso = 'Inicia sesión para separar tu pedido. Tus productos se conservan.'; return pintarPedido(true); }
        if (s.rol !== 'comprador') { aviso = 'Solo los clientes pueden separar pedidos.'; return pintarPedido(); }
        const ventas = FeriStore.leer('feriapp_ventas', []);
        const id = 4 + ventas.length + 1; // el script SQL de ejemplo ya trae 4 ventas
        const venta = { id, cliente: s.id || s.nombre, local: pedido.local, fecha: new Date().toISOString(), total: totalPedido(), estado: 'registrada',
            detalle: pedido.items.map(i => { const p = porId(i.id); return { producto: p.id, cantidad: i.cant, precio_unitario: p.precio, subtotal: redondear(p.precio * i.cant) }; }) };
        const r = Inventario.descontar(pedido.items); // valida todo y descuenta todo o nada (regla 4)
        if (!r.ok) { aviso = r.msg; return pintarPedido(); }
        ventas.push(venta);
        if (!FeriStore.guardar('feriapp_ventas', ventas)) { aviso = 'No se pudo registrar el pedido. Inténtalo de nuevo.'; return pintarPedido(); }
        confirmada = { id, local: localDe(pedido.local), total: venta.total };
        vaciar(); pintarGrilla();
    }

    function pintarPedido(mostrarLogin) {
        const cont = $('pedido');
        if (confirmada) {
            const l = confirmada.local;
            cont.innerHTML = `<h2 style="color: var(--color-primary);">pedido separado</h2>
                <p class="msg ok" style="margin-top: var(--space-1);">Número de venta: <strong>#${confirmada.id}</strong></p>
                <p>Total: <strong>${cop(confirmada.total)}</strong></p>
                <p class="vacio" style="margin-top: var(--space-1);">Recógelo en el local ${l.codigo} (${l.nombre}) cuando el productor lo marque como <em>lista</em>. Presenta el número de venta. El pago se hace directamente con el productor; FeriApp no ofrece financiación.</p>
                <button class="enlace-sec" id="nuevo">hacer otro pedido</button>`;
            $('nuevo').onclick = () => { confirmada = null; pintarPedido(); };
            return;
        }
        let h = '<h2 style="color: var(--color-primary);">tu pedido</h2>';
        if (aviso) h += `<p class="msg" role="alert" style="margin-top: var(--space-1);">${aviso}${mostrarLogin ? ' <a href="login.html"><strong>Iniciar sesión</strong></a>' : ''}</p>`;
        if (!pedido.items.length) {
            h += '<p class="vacio">Agrega productos de un mismo local para separarlos.</p>';
        } else {
            const l = localDe(pedido.local);
            h += `<p class="vacio">${l.nombre} · local ${l.codigo}</p><ul>` + pedido.items.map(i => {
                const p = porId(i.id);
                return `<li><span>${p.nombre}<br><span class="vacio">${cop(p.precio)} por ${p.u}</span></span>
                        <span class="stepper peq" role="group" aria-label="Cantidad de ${p.nombre}">
                            <button type="button" data-pq="${i.id},-1" aria-label="Menos">−</button>
                            <input type="text" readonly value="${fmtCant(i.cant)}" aria-label="${p.u}">
                            <button type="button" data-pq="${i.id},1" aria-label="Más" ${i.cant + Inventario.paso(p.u) > p.cant + 1e-9 ? 'disabled' : ''}>+</button>
                        </span>
                        <span style="text-align:right; min-width: 70px;"><strong>${cop(p.precio * i.cant)}</strong><br><button class="quitar" data-del="${i.id}" aria-label="Quitar ${p.nombre}">quitar</button></span></li>`;
            }).join('') + `</ul><div class="total"><span>total</span><strong>${cop(totalPedido())}</strong></div>
                <button class="botonaccion" id="confirmar" style="width: 100%;">separar pedido</button>
                <button class="enlace-sec" id="vaciar">vaciar pedido</button>`;
        }
        cont.innerHTML = h;
    }

    // ---- Eventos ----
    $('grilla').addEventListener('click', e => {
        const q = e.target.closest('[data-q]'); if (q) { const [id, d] = q.dataset.q.split(',').map(Number); return ajustarInput(id, d); }
        const b = e.target.closest('[data-add]'); if (b) agregar(+b.dataset.add);
    });
    $('pedido').addEventListener('click', e => {
        const q = e.target.closest('[data-pq]'); if (q) { const [id, d] = q.dataset.pq.split(',').map(Number); return cambiar(id, d); }
        const d = e.target.closest('[data-del]'); if (d) return quitar(+d.dataset.del);
        if (e.target.id === 'confirmar') confirmar();
        if (e.target.id === 'vaciar') vaciar();
    });
    ['fbusca', 'fcat', 'flocal'].forEach(id => $(id).addEventListener('input', pintarGrilla));
    $('fplaza').addEventListener('change', () => { llenarLocales(); pintarGrilla(); });

    // Si el borrador guardado ya no cabe en las existencias, se descarta lo que sobra
    pedido.items = pedido.items.filter(i => porId(i.id) && Inventario.validar(porId(i.id), i.cant).ok);
    if (!pedido.items.length) pedido.local = null;
    FeriSesion.pintarEnlace();
    llenarFiltros(); pintarGrilla(); pintarPedido();
    </script>
</body>
</html>
